<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 깨기</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../_shared/ui.css">
<style>
  /* 화면 구성: 위 = 안내 띠, 아래 = 사진판 (사람 모습은 보이지 않음) */
  :root { --head: clamp(170px, 22vh, 230px); }
  #headband { position: fixed; left: 0; right: 0; top: 0; height: var(--head); z-index: 10; display: grid;
    grid-template-columns: minmax(0, 1fr) min(1000px, 58vw) minmax(0, 1fr); gap: 16px; padding: 12px 16px;
    background: #0c1017; border-bottom: 2px solid rgba(255,255,255,.08); box-sizing: border-box; }
  #headband .side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #headband .side.right { align-items: flex-end; }
  #headband .center { position: relative; min-width: 0; }
  #backLink { align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 14px; text-decoration: none; }
  #stop { padding: 6px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 14px; }

  #guide { position: absolute; inset: 0; box-sizing: border-box; padding: 12px 26px 14px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  #guide .msg { font-size: clamp(34px, 4.2vw, 64px); font-weight: 900; letter-spacing: -1px; line-height: 1.1; white-space: nowrap; }
  #guide .msg.pulse { animation: pulse 1s ease-in-out 3; }
  @keyframes pulse { 50% { transform: scale(1.06); color: var(--warn); } }
  #guide .sub { margin-top: 6px; font-size: 22px; color: #c3cad6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #guide .meter { margin-top: 12px; display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 800; color: #c3cad6; }
  #guide .meter .bar { flex: 1; height: 16px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
  #guide .meter .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--warn), var(--bad)); border-radius: inherit; transition: width .3s; }
  #pct { min-width: 4.2em; text-align: right; color: var(--text); }

  .cards { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
  .card { padding: 8px 14px 8px 22px; position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 10px; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 9px; background: var(--c); }
  .card .n { font-weight: 800; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .s { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .card .s small { font-size: 16px; font-weight: 700; color: var(--muted); margin-left: 4px; }

  /* 무대: 사진판(fx) */
  #fx { position: fixed; left: 0; right: 0; bottom: 0; top: var(--head); width: 100%; height: calc(100vh - var(--head)); pointer-events: none; z-index: 5; }

  .big { display: flex; gap: 14px; flex-wrap: wrap; }
  .big button { min-width: 96px; padding: 12px 22px; border-radius: 18px; border: 3px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07);
    font-size: 26px; font-weight: 800; color: var(--text); }
  .big button.on { background: var(--text); color: #0b0e13; border-color: var(--text); }
  .big button small { display: block; font-size: 15px; font-weight: 600; opacity: .75; margin-top: 2px; }

  /* 1. 설정 */
  #setup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1120px, calc(100vw - 32px)); max-height: calc(100vh - 24px); overflow: auto; padding: 22px 36px; z-index: 12; box-sizing: border-box; }
  #setup h1 { margin: 0; font-size: 48px; letter-spacing: -1px; }
  #setup .lead { margin: 2px 0 12px; color: #c3cad6; font-size: 22px; }
  #setup label.t { display: block; font-size: 20px; font-weight: 800; color: #c3cad6; margin: 12px 0 8px; }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .ph { position: relative; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; border: 4px solid transparent; background: #1b2230 center / cover no-repeat; cursor: pointer; padding: 0; }
  .ph.on { border-color: var(--ok); box-shadow: 0 0 0 3px rgba(61,220,151,.25); }
  .ph.on::after { content: "✓"; position: absolute; left: 8px; top: 6px; width: 34px; height: 34px; border-radius: 50%; background: var(--ok); color: #0b0e13; font-size: 22px; font-weight: 900; display: grid; place-items: center; }
  .ph .del { position: absolute; right: 6px; top: 6px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 16px; opacity: 0; }
  .ph:hover .del { opacity: 1; }
  .tile { aspect-ratio: 4 / 3; border-radius: 14px; border: 3px dashed rgba(255,255,255,.25); background: rgba(255,255,255,.04); color: var(--text);
    display: grid; place-content: center; text-align: center; font-size: 20px; font-weight: 800; gap: 4px; cursor: pointer; }
  .tile span { font-size: 38px; }
  .tile small { font-size: 13px; font-weight: 600; color: var(--muted); }
  #textRow { display: flex; gap: 10px; margin-top: 10px; }
  #textRow input { flex: 1; font: 700 24px var(--font); padding: 10px 16px; border-radius: 12px; border: 2px solid var(--line); background: #0f141c; color: var(--text); }
  #err { color: var(--bad); font-weight: 700; margin-top: 6px; min-height: 0; }
  .row2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 0 28px; }
  #start { margin-top: 16px; width: 100%; padding: 20px; font-size: 34px; font-weight: 900; border-radius: 20px; border: 0; background: var(--ok); color: #0b0e13; }
  #seen { margin: 10px 0 0; font-size: 20px; color: #c3cad6; }
  #seen.warn { color: var(--warn); }
  #dropHint { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(61,220,151,.18); border: 6px dashed var(--ok); font-size: 48px; font-weight: 900; pointer-events: none; }

  /* 3. 결과 */
  #results { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(900px, calc(100vw - 32px)); padding: 30px 36px; z-index: 12; box-sizing: border-box; text-align: center; }
  #results h2 { margin: 0; font-size: 56px; }
  #results .praise { font-size: 28px; color: var(--ok); font-weight: 800; margin: 4px 0 18px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .stats div { padding: 14px; border-radius: 16px; background: rgba(255,255,255,.06); font-size: 20px; color: #c3cad6; }
  .stats b { display: block; font-size: 44px; color: var(--text); font-variant-numeric: tabular-nums; }
  #who { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; font-size: 22px; margin-bottom: 18px; }
  #who span { padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.07); border-left: 8px solid var(--c); }
  #results .big { justify-content: center; }
  #results .big button { font-size: 28px; padding: 18px 26px; }

  #pointerHint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 20px; color: #c3cad6; z-index: 13; }
  #soundBlocked { position: fixed; right: 16px; bottom: 14px; padding: 10px 16px; border-radius: 12px; background: var(--warn); color: #1a1406; font-weight: 700; z-index: 30; cursor: pointer; }
</style>
</head>
<body>
<canvas id="fx"></canvas>

<!-- 위: 안내 띠 -->
<header id="headband">
  <div class="side left">
    <a href="../" id="backLink">← 게임 고르기</a>
    <div class="cards" id="cardsL"></div>
  </div>
  <div class="center">
    <section id="guide" class="panel hidden">
      <div class="msg" id="msg">팔을 뒤로 했다가 앞으로 휙! 💪</div>
      <div class="sub" id="sub">사진을 향해 공을 던지듯이</div>
      <div class="meter"><span>깨진 정도</span><div class="bar"><i id="bar"></i></div><span id="pct">0%</span></div>
    </section>
  </div>
  <div class="side right">
    <button id="stop" class="hidden" title="그만하고 사진 고르기로 (Esc)">그만하기</button>
    <div class="cards" id="cardsR"></div>
  </div>
</header>

<!-- 1. 설정 -->
<section id="setup" class="panel">
  <h1>📸 사진 깨기</h1>
  <p class="lead">사진을 고르고, 공을 던지듯 팔을 <b>휙!</b> 던지면 사진이 조금씩 깨져요.</p>

  <label class="t">어떤 사진을 깰까요?</label>
  <div id="gallery">
    <button class="tile" id="upload" title="사진 파일 고르기 (사진을 끌어다 놓거나 Ctrl+V로 붙여 넣어도 돼요)"><span>📷</span>사진 올리기<small>끌어다 놓기·붙여넣기도 돼요</small></button>
    <button class="tile" id="textBtn" title="글자로 그림 만들기"><span>✏️</span>글자로 만들기<small>예: 스트레스, 걱정</small></button>
  </div>
  <div id="textRow" class="hidden">
    <input id="textIn" maxlength="20" placeholder="깨고 싶은 말 (예: 무릎 통증)">
    <button class="btn primary" id="textMake">만들기</button>
  </div>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <div id="err"></div>

  <div class="row2">
    <div>
      <label class="t">무엇을 던질까요?</label>
      <div class="big" id="optObj">
        <button class="hand-target" data-v="ball">⚾ 공</button><button class="hand-target" data-v="tomato">🍅 토마토</button><button class="hand-target" data-v="egg">🥚 달걀</button><button class="hand-target" data-v="mix">🎲 섞어서</button>
      </div>
    </div>
    <div>
      <label class="t">던지기</label>
      <div class="big" id="optPower">
        <button class="hand-target" data-v="gentle">살살<small>가볍게 던져도 돼요</small></button><button class="hand-target" data-v="strong">힘껏<small>세게 던져야 해요</small></button>
      </div>
    </div>
  </div>

  <button id="start" class="hand-target">시작하기 ▶</button>
  <div id="seen">카메라 연결 중…</div>
</section>

<!-- 3. 결과 -->
<section id="results" class="panel hidden">
  <h2>🎉 다 깼어요!</h2>
  <div class="praise" id="praise">속이 시원하시죠?</div>
  <div class="stats">
    <div><b id="rThrows">0</b>번 던졌어요</div>
    <div><b id="rTime">0:00</b>걸린 시간</div>
    <div><b id="rPower">0%</b>가장 센 던지기</div>
  </div>
  <div id="who"></div>
  <div class="big">
    <button class="hand-target" id="again">🔁 다시 깨기</button>
    <button class="hand-target" id="toSetup">📷 다른 사진</button>
    <button class="hand-target" id="toGames">🎮 다른 게임</button>
  </div>
</section>

<div id="pointerHint" class="hidden">✋ 손을 들어 버튼 위에 잠시 올려 두세요</div>
<div id="soundBlocked" class="hidden">🔇 소리를 켜려면 화면을 한 번 눌러 주세요</div>
<div id="dropHint" class="hidden">📷 여기에 놓으면 사진이 올라가요</div>

<script type="module" src="game.js"></script>
</body>
</html>
