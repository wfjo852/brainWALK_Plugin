<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운동 게임 고르기</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/ui.css">
<style>
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* 내 모습은 은은하게 뒤에 (지금 내가 화면에 잡히고 있다는 확인용) */
  .dim { position: fixed; inset: 0; background: radial-gradient(ellipse at center, rgba(14,18,24,.55), rgba(14,18,24,.88)); pointer-events: none; }

  main { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.5vh; padding: 24px; }
  h1 { margin: 0; font-size: clamp(36px, 5.2vw, 64px); letter-spacing: -1px; text-align: center; }
  .how { margin: 0; font-size: clamp(20px, 2.4vw, 30px); color: var(--muted); text-align: center; }
  .how b { color: var(--text); }

  .cards { display: flex; gap: 4vw; justify-content: center; flex-wrap: wrap; max-width: 100%; }
  .card { width: clamp(300px, 30vw, 440px); min-height: clamp(300px, 42vh, 460px); padding: 34px 32px; border-radius: 28px;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px;
    background: rgba(22, 28, 38, .92); border: 3px solid rgba(255,255,255,.14); color: var(--text); cursor: pointer; }
  .card:hover { border-color: rgba(255,255,255,.4); }
  .card .icon { font-size: clamp(80px, 9vw, 120px); line-height: 1.1; }
  .card .title { font-size: clamp(36px, 3.6vw, 52px); font-weight: 800; letter-spacing: -1px; }
  .card .desc { font-size: clamp(19px, 1.7vw, 24px); color: #c3cad6; line-height: 1.45; }
  .card .tags { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .card .tags span { padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.09); font-size: 18px; color: #c3cad6; }

  #status { font-size: clamp(18px, 2vw, 24px); color: var(--warn); min-height: 1.4em; text-align: center; }
  #status.ok { color: var(--ok); }

  .admin { position: fixed; left: 16px; bottom: 14px; font-size: 13px; color: var(--muted); z-index: 5; }
  .admin a { color: var(--muted); }
  #soundBlocked { position: fixed; right: 16px; bottom: 14px; padding: 10px 16px; border-radius: 12px; background: var(--warn); color: #1a1406; font-weight: 700; z-index: 5; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="dim"></div>

<main>
  <h1>어떤 운동을 할까요?</h1>
  <p class="how">✋ <b>손을 들어</b> 하고 싶은 카드 위에 <b>잠시 올려 두세요</b></p>
  <div class="cards" id="cards"></div>
  <div id="status"></div>
</main>

<div class="admin">관리자: <a href="../">뷰어</a> · 카메라 없이 시험 <span id="simLinks"></span></div>
<div id="soundBlocked" class="hidden">🔇 소리가 꺼져 있어요 — 화면을 한 번 눌러 주세요</div>

<script type="module">
import { FemtoClient } from './_shared/femto-client.js';
import { Stage } from './_shared/video-layer.js';
import { HandPointer, screenToHand } from './_shared/hand-pointer.js';
import { Sound } from './_shared/sound.js';

// ───── 게임 목록: 새 게임을 만들면 games/<폴더>/ 에 넣고 여기에 한 줄 추가 ─────
const GAMES = [
  {
    folder: 'flag', icon: '🚩', title: '청기백기',
    desc: '"오른팔 올려!" 하면 오른팔을,<br>"왼발 들어!" 하면 왼발을 들어요.',
    tags: ['1~4명', '팔·다리 운동', '집중력'],
    say: '청기백기',
  },
  {
    folder: 'smash', icon: '📸', title: '사진 깨기',
    desc: '사진을 향해 공을 던지듯<br>팔을 휙! 하면 사진이 깨져요.',
    tags: ['여럿이 함께', '팔 운동', '스트레스 풀기'],
    say: '사진 깨기',
  },
];

const params = new URLSearchParams(location.search);
const SIM = Math.max(0, Math.min(4, parseInt(params.get('sim') || '0', 10) || 0));
const simQuery = SIM ? `?sim=${SIM}` : '';

document.getElementById('cards').innerHTML = GAMES.map(g => `
  <a class="card hand-target" href="${g.folder}/${simQuery}" data-say="${g.say}">
    <div class="icon">${g.icon}</div>
    <div class="title">${g.title}</div>
    <div class="desc">${g.desc}</div>
    <div class="tags">${g.tags.map(t => `<span>${t}</span>`).join('')}</div>
  </a>`).join('');
document.getElementById('simLinks').innerHTML = [1, 2, 3, 4].map(n => `<a href="?sim=${n}">${n}명</a>`).join(' ');

const client = new FemtoClient({ sim: SIM });
const stage = new Stage(document.getElementById('stage'), client);
const sound = new Sound();
const pointer = new HandPointer({ client, onSelect: el => { sound.success(); sound.say(`${el.dataset.say ?? ''} 시작할게요`, 0.9); } });
// 선택 후 음성이 조금 들리도록 잠깐 뒤에 이동
for (const a of document.querySelectorAll('.card')) a.addEventListener('click', e => {
  e.preventDefault();
  setTimeout(() => (location.href = a.getAttribute('href')), 700);
});

// 소리가 막혀 있으면 (브라우저가 화면을 한 번 누르기 전까지 소리를 막는 경우) 안내
function checkSound() {
  const blocked = !navigator.userActivation?.hasBeenActive && sound.blocked();
  document.getElementById('soundBlocked').classList.toggle('hidden', !blocked);
}
document.getElementById('soundBlocked').onclick = () => { sound.unlock(); checkSound(); };
addEventListener('pointerdown', () => { sound.unlock(); checkSound(); });

let greeted = false, last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  stage.draw({ others: true });
  pointer.update(dt);
  const st = document.getElementById('status');
  const n = client.bodies.size;
  if (!client.connected || client.status.state === 'error') { st.textContent = '⚠ 카메라 프로그램에 연결 중이에요…'; st.className = ''; }
  else if (n === 0) { st.textContent = '카메라 앞에 서 주세요'; st.className = ''; }
  else if (!pointer.visible) { st.textContent = '손을 가슴 높이로 들어 보세요'; st.className = 'ok'; }
  else { st.textContent = pointer.target ? '그대로 잠시 기다리세요…' : '고르고 싶은 카드 위로 손을 옮기세요'; st.className = 'ok'; }
  if (!greeted && n > 0) { greeted = true; sound.say('안녕하세요! 손을 들어서 하고 싶은 운동을 골라 주세요.', 0.9); }
}
requestAnimationFrame(loop);
setTimeout(checkSound, 1500);

// 가상 플레이어 시험에서만: 손으로 카드 가리키기 (읽기 전용 도우미)
if (SIM) window.__pointAt = (selector) => {
  const el = document.querySelector(selector), r = el.getBoundingClientRect();
  const h = screenToHand((r.left + r.width / 2) / innerWidth, (r.top + r.height / 2) / innerHeight);
  client.sim.point(0, h);
};
</script>
</body>
</html>
